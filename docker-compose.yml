
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      postageres_user: ${postageres_user}
      postageres_password: ${postageres_password}
      postageres_db: ${postageres_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postageres_user} -d ${postageres_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy